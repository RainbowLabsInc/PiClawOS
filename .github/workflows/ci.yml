name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: piclaw-os
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 = Minimum aus requires-python; der Pi läuft neuer (3.13),
          # aber das Minimum muss grün bleiben.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: piclaw-os/requirements-ci.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      - name: Ruff
        run: ruff check piclaw tests

      - name: Pytest
        # tests/debug/ macht Live-Netzwerk-Calls – nie in CI
        run: python -m pytest tests piclaw/tests --ignore=tests/debug -q
