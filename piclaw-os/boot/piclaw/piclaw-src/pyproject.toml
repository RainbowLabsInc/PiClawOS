[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piclaw"
version = "0.18.0"
description = "PiClaw – AI Operating System for Raspberry Pi 5"
license = { text = "MIT" }
authors = [{ name = "Patrick Völk" }]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    # 0.4-API (classmethod Fetcher.get) wird vorausgesetzt; <0.5 weil die
    # Lib API-Brüche in Minor-Releases hat (0.2→0.3→0.4 jeweils breaking)
    "scrapling>=0.4,<0.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "tomli-w>=1.0",
    "psutil>=5.9",
    "croniter>=1.4",
    # Timezone detection from coordinates (used in setup wizard)
    "timezonefinder>=6.2",
    # Local LLM (CPU-only build for Pi 5 arm64) – 0.3.20+ for Gemma 4
    "llama-cpp-python>=0.3.20",
    # Encrypted secrets store
    "cryptography>=42.0",
    # Messaging adapters
    "discord.py>=2.3",
    "threema.gateway>=8.0",
    # MQTT adapter (optional - v0.10)
    "aiomqtt>=2.0; extra == 'mqtt'",
    # Email for AI Agents
    "agentmail>=0.4.0",
    # Camera (optional - v0.10, installed separately)
    # libcamera-apps via apt, fswebcam via apt
    # smbus2 already in hardware deps
    # GPIO (only installs on actual Pi hardware)
    "RPi.GPIO>=0.7.1; platform_machine=='aarch64'",
    "gpiozero>=2.0; platform_machine=='aarch64'",
]

[project.optional-dependencies]
dev  = ["httpx", "pytest", "pytest-asyncio"]

[project.scripts]
piclaw           = "piclaw.cli:main"
piclaw-agent     = "piclaw.daemon:run"
piclaw-crawler   = "piclaw.agents.crawler:run"
piclaw-watchdog  = "piclaw.agents.watchdog:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["piclaw*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
# boot/ ist der generierte SD-Karten-Mirror (make sync) – nie linten
extend-exclude = ["boot", "piclaw.egg-info"]

[tool.ruff.lint]
# Bewusst schlanker Einstiegs-Regelsatz für eine bestehende Codebase:
# E/W (pycodestyle), F (pyflakes – hätte den asyncio.coroutine-Crash
# gefangen), B (bugbear), UP (pyupgrade).
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # Zeilenlänge – historisch gewachsen, line-length nur als Richtwert
    "E402",  # Late-Imports sind hier bewusstes Muster (Lazy-Load schwerer Deps)
    "E701", "E702", "E731", "E741",  # Stil – kein Churn im Bestand
    "B007",  # ungenutzte Loop-Variablen – Stil
    "B008",  # Funktionsaufruf im Default – FastAPI-Depends()-Idiom
    "B904",  # raise ohne from – nachrüsten lohnt separat, nicht hier
    "B905",  # zip ohne strict – Verhalten im Bestand beibehalten
]

[tool.ruff.lint.per-file-ignores]
# Tests dürfen breite Excepts, ungenutzte Importe/Variablen (Fixtures) haben
"tests/**" = ["B", "F401", "F811", "F841"]
"piclaw/tests/**" = ["B", "F401", "F811", "F841"]
# __init__.py: Re-Exports sind Absicht
"**/__init__.py" = ["F401"]
